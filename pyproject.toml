[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-engine"
version = "1.3.0"
description = "Layout-Aware Automated Localization Scanner & Closed-Loop Repair Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "uharfbuzz>=0.40.0",
    "fonttools>=4.50.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "razorpay>=2.0.0",
    "slowapi>=0.1.10",
    "playwright>=1.40.0",
]

[project.scripts]
polyglot = "polyglot.cli:main"

[tool.setuptools.packages.find]
include = ["polyglot*", "app*"]
