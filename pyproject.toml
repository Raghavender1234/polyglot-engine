[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-engine"
version = "1.4.0"
description = "Privacy-First Local CLI that Scans, Diagnoses, and Repairs Multilingual UI Layout Problems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
visual = [
    "Pillow>=10.0.0",
    "transformers>=4.44.0",
    "torch>=2.2.0",
    "accelerate>=0.30.0",
    "einops>=0.8.0",
]
translation = [
    "openai>=1.40.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "uharfbuzz>=0.40.0",
    "fonttools>=4.50.0",
    "python-multipart>=0.0.9",
    "razorpay>=2.0.0",
    "slowapi>=0.1.10",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
all = [
    "Pillow>=10.0.0",
    "transformers>=4.44.0",
    "torch>=2.2.0",
    "accelerate>=0.30.0",
    "einops>=0.8.0",
    "openai>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "uharfbuzz>=0.40.0",
    "fonttools>=4.50.0",
    "python-multipart>=0.0.9",
    "razorpay>=2.0.0",
    "slowapi>=0.1.10",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
polyglot = "polyglot.cli:main"


[tool.setuptools.packages.find]
include = ["polyglot*", "app*"]
